name: Apply customer ownership contract

on:
  push:
    branches:
      - fix/47-customer-dto-ownership
    paths:
      - '.github/workflows/customer-contract-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finansal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d finansal_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finansal_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/47-customer-dto-ownership

      - name: Apply exact customer contract codemod
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/customer_contract_codemod.py')
          text = path.read_text()
          old = "    expected=2,\n)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old match guard, found {text.count(old)}')
          text = text.replace(old, "    expected=3,\n)", 1)

          stale = '''replace(
              service,
              "      const whereClause: any = userId ? { userId } : {};",
              "      const whereClause: any = { userId };",
          )

          controller = "backend/src/modules/customers/controller.ts"'''
          if text.count(stale) != 1:
              raise SystemExit(f'expected one stale follow-up replacement, found {text.count(stale)}')
          text = text.replace(stale, 'controller = "backend/src/modules/customers/controller.ts"')
          path.write_text(text)
          PY
          python3 tools/customer_contract_codemod.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit production backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations to clean PostgreSQL
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/customers/controller.ts backend/src/modules/customers/service.ts
          git commit -m "fix: enforce customer ownership and DTO contract"
          git push origin HEAD:fix/47-customer-dto-ownership
