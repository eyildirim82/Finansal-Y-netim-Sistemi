name: Apply Decimal arithmetic codemod

on:
  push:
    branches:
      - fix/37-exact-money-decimals
    paths:
      - '.github/workflows/decimal-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/37-exact-money-decimals

      - name: Apply targeted Decimal conversions
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new, min_count in replacements:
                  count = text.count(old)
                  if count < min_count:
                      raise SystemExit(f'{path}: expected at least {min_count} occurrence(s) of {old!r}, found {count}')
                  text = text.replace(old, new)
              p.write_text(text)

          helper_import = "import { moneyToNumber } from '../../shared/prismaDecimalJson';\n"

          edit('backend/src/modules/banking/controller.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("const startBalance = (firstTransaction.balanceAfter || 0) - \n        (firstTransaction.direction === 'IN' ? firstTransaction.amount : -firstTransaction.amount);",
               "const startBalance = moneyToNumber(firstTransaction.balanceAfter) - \n        (firstTransaction.direction === 'IN' ? moneyToNumber(firstTransaction.amount) : -moneyToNumber(firstTransaction.amount));", 1),
              ("currentBalance += tx.amount;", "currentBalance += moneyToNumber(tx.amount);", 1),
              ("currentBalance -= tx.amount;", "currentBalance -= moneyToNumber(tx.amount);", 1),
              ("const difference = tx.balanceAfter - currentBalance;", "const difference = moneyToNumber(tx.balanceAfter) - currentBalance;", 1),
              ("actualBalance: tx.balanceAfter,", "actualBalance: moneyToNumber(tx.balanceAfter),", 1),
              ("sum + tx.amount", "sum + moneyToNumber(tx.amount)", 3),
          ])

          edit('backend/src/modules/banking/paymentMatchingService.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("Math.abs(t.amount - transactionAmount)", "Math.abs(moneyToNumber(t.amount) - transactionAmount)", 1),
              ("recentTransactions.map(t => t.amount)", "recentTransactions.map(t => moneyToNumber(t.amount))", 1),
          ])

          edit('backend/src/modules/cash/controller.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("let currentBalance = lastCashFlow.closingBalance;", "let currentBalance = moneyToNumber(lastCashFlow.closingBalance);", 1),
              ("sum + t.amount", "sum + moneyToNumber(t.amount)", 4),
              ("currentBalance = lastCashFlow.closingBalance + todayIncome - todayExpense;", "currentBalance = moneyToNumber(lastCashFlow.closingBalance) + todayIncome - todayExpense;", 1),
              ("const expectedBalance = lastCashFlow ? lastCashFlow.closingBalance : 0;", "const expectedBalance = moneyToNumber(lastCashFlow?.closingBalance);", 1),
          ])

          edit('backend/src/modules/categories/controller.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("totalIncome: incomeStats._sum?.amount || 0,", "totalIncome: moneyToNumber(incomeStats._sum?.amount),", 1),
              ("totalExpense: expenseStats._sum?.amount || 0,", "totalExpense: moneyToNumber(expenseStats._sum?.amount),", 1),
              ("netAmount: (incomeStats._sum?.amount || 0) - (expenseStats._sum?.amount || 0),", "netAmount: moneyToNumber(incomeStats._sum?.amount) - moneyToNumber(expenseStats._sum?.amount),", 1),
          ])

          edit('backend/src/modules/customers/service.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("customers.filter(c => c.balance && c.balance.netBalance < 0).length", "customers.filter(c => c.balance && moneyToNumber(c.balance.netBalance) < 0).length", 1),
              ("customers.reduce((sum, c) => sum + (c.balance?.netBalance || 0), 0) / total", "customers.reduce((sum, c) => sum + moneyToNumber(c.balance?.netBalance), 0) / total", 1),
          ])

          edit('backend/src/modules/extracts/controller.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("totalDebit: existingBalance.totalDebit + totalDebit,\n              totalCredit: existingBalance.totalCredit + totalCredit,\n              netBalance: (existingBalance.totalCredit + totalCredit) - (existingBalance.totalDebit + totalDebit),",
               "totalDebit: existingBalance.totalDebit.plus(totalDebit),\n              totalCredit: existingBalance.totalCredit.plus(totalCredit),\n              netBalance: existingBalance.totalCredit.plus(totalCredit).minus(existingBalance.totalDebit.plus(totalDebit)),", 1),
              ("const expectedBalance = customer?.balance?.netBalance || 0;", "const expectedBalance = moneyToNumber(customer?.balance?.netBalance);", 1),
          ])

          edit('backend/src/modules/transactions/controller.ts', [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("totalAmount: totalStats._sum?.amount || 0,", "totalAmount: moneyToNumber(totalStats._sum?.amount),", 1),
              ("totalIncome: incomeStats._sum?.amount || 0,", "totalIncome: moneyToNumber(incomeStats._sum?.amount),", 1),
              ("netAmount: (incomeStats._sum?.amount || 0) - (expenseStats._sum?.amount || 0)", "netAmount: moneyToNumber(incomeStats._sum?.amount) - moneyToNumber(expenseStats._sum?.amount)", 1),
          ])

          report_replacements = [
              ("import { logError } from '../../shared/logger';\n", "import { logError } from '../../shared/logger';\n" + helper_import, 1),
              ("totalIncome: incomeStats._sum.amount || 0,", "totalIncome: moneyToNumber(incomeStats._sum.amount),", 2),
              ("totalExpense: expenseStats._sum.amount || 0,", "totalExpense: moneyToNumber(expenseStats._sum.amount),", 2),
              ("netAmount: (incomeStats._sum.amount || 0) - (expenseStats._sum.amount || 0),", "netAmount: moneyToNumber(incomeStats._sum.amount) - moneyToNumber(expenseStats._sum.amount),", 2),
              ("income: currentMonthIncome._sum.amount || 0,", "income: moneyToNumber(currentMonthIncome._sum.amount),", 1),
              ("expense: currentMonthExpense._sum.amount || 0,", "expense: moneyToNumber(currentMonthExpense._sum.amount),", 1),
              ("net: (currentMonthIncome._sum.amount || 0) - (currentMonthExpense._sum.amount || 0)", "net: moneyToNumber(currentMonthIncome._sum.amount) - moneyToNumber(currentMonthExpense._sum.amount)", 1),
              ("income: lastMonthIncome._sum.amount || 0,", "income: moneyToNumber(lastMonthIncome._sum.amount),", 1),
              ("expense: lastMonthExpense._sum.amount || 0,", "expense: moneyToNumber(lastMonthExpense._sum.amount),", 1),
              ("net: (lastMonthIncome._sum.amount || 0) - (lastMonthExpense._sum.amount || 0)", "net: moneyToNumber(lastMonthIncome._sum.amount) - moneyToNumber(lastMonthExpense._sum.amount)", 1),
              ("amount: incomeStats?._sum.amount || 0,", "amount: moneyToNumber(incomeStats?._sum.amount),", 1),
              ("amount: expenseStats?._sum.amount || 0,", "amount: moneyToNumber(expenseStats?._sum.amount),", 1),
              ("amount: (incomeStats?._sum.amount || 0) + (expenseStats?._sum.amount || 0),", "amount: moneyToNumber(incomeStats?._sum.amount) + moneyToNumber(expenseStats?._sum.amount),", 1),
              ("const totalIncome = incomeStats?._sum.amount || 0;", "const totalIncome = moneyToNumber(incomeStats?._sum.amount);", 1),
              ("const totalExpense = expenseStats?._sum.amount || 0;", "const totalExpense = moneyToNumber(expenseStats?._sum.amount);", 1),
              ("totalIncome: incomeTotal._sum.amount || 0,", "totalIncome: moneyToNumber(incomeTotal._sum.amount),", 1),
              ("totalExpense: expenseTotal._sum.amount || 0,", "totalExpense: moneyToNumber(expenseTotal._sum.amount),", 1),
              ("netCashFlow: (incomeTotal._sum.amount || 0) - (expenseTotal._sum.amount || 0)", "netCashFlow: moneyToNumber(incomeTotal._sum.amount) - moneyToNumber(expenseTotal._sum.amount)", 1),
              ("amount: flow._sum.amount || 0", "amount: moneyToNumber(flow._sum.amount)", 2),
              ("collection.totalPaid += payment.amount;", "collection.totalPaid += moneyToNumber(payment.amount);", 1),
              ("bankPayments.reduce((sum, p) => sum + p.amount, 0)", "bankPayments.reduce((sum, p) => sum + moneyToNumber(p.amount), 0)", 1),
              ("t.type === 'CUSTOMER' && t.amount < 0", "t.type === 'CUSTOMER' && moneyToNumber(t.amount) < 0", 1),
              ("sum + Math.abs(t.amount)", "sum + Math.abs(moneyToNumber(t.amount))", 1),
              ("t.type === 'CUSTOMER' && t.amount > 0", "t.type === 'CUSTOMER' && moneyToNumber(t.amount) > 0", 1),
              ("sum + t.amount", "sum + moneyToNumber(t.amount)", 1),
              ("amount: invoice.debit, // Fatura tutarı\n          remainingAmount: invoice.debit", "amount: moneyToNumber(invoice.debit), // Fatura tutarı\n          remainingAmount: moneyToNumber(invoice.debit)", 1),
              ("invoicesWithPaymentStatus.reduce((sum, inv) => sum + inv.amount, 0)", "invoicesWithPaymentStatus.reduce((sum, inv) => sum + moneyToNumber(inv.amount), 0)", 2),
              ("const sortedInvoices = [...allInvoices].sort((a: any, b: any) =>", "const sortedInvoices = allInvoices.map(invoice => ({ ...invoice, debit: moneyToNumber(invoice.debit) })).sort((a: any, b: any) =>", 2),
              ("const sortedPayments = [...allPayments].sort((a: any, b: any) =>", "const sortedPayments = allPayments.map(payment => ({ ...payment, credit: moneyToNumber(payment.credit) })).sort((a: any, b: any) =>", 2),
              ("payments.reduce((sum, payment) => sum + payment.credit, 0)", "payments.reduce((sum, payment) => sum + moneyToNumber(payment.credit), 0)", 2),
              ("if (tx.debit > 0) {\n          entry.invoices.push({ ...tx, remaining: tx.debit });\n        } else if (tx.credit > 0) {\n          entry.payments.push(tx);\n        }",
               "const debit = moneyToNumber(tx.debit);\n        const credit = moneyToNumber(tx.credit);\n        if (debit > 0) {\n          entry.invoices.push({ ...tx, debit, remaining: debit });\n        } else if (credit > 0) {\n          entry.payments.push({ ...tx, credit });\n        }", 1),
          ]
          edit('backend/src/modules/reports/controller.ts', report_replacements)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder?schema=public
        run: npx prisma generate

      - name: Compile backend
        working-directory: backend
        run: npm run build

      - name: Commit Decimal arithmetic fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules
          git commit -m "fix: make financial calculations Decimal-aware"
          git push origin HEAD:fix/37-exact-money-decimals
