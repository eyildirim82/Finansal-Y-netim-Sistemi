name: Inventory backend dependency audit

on:
  push:
    branches:
      - fix/40-dependency-audit
    paths:
      - '.github/workflows/dependency-audit-inventory.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Capture npm audit inventory
        run: |
          npm audit --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT_COUNTS', JSON.stringify(counts));

          const rows = Object.values(audit.vulnerabilities || {}).map(v => ({
            name: v.name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            fix: typeof v.fixAvailable === 'object'
              ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
              : String(v.fixAvailable),
            via: (v.via || []).map(item => typeof item === 'string' ? item : `${item.name}:${item.title}`).join(' | ')
          }));

          const rank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
          rows.sort((a, b) => Number(b.direct) - Number(a.direct) || (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9) || a.name.localeCompare(b.name));

          console.log('\nDIRECT_FINDINGS');
          rows.filter(r => r.direct).forEach(r => console.log(JSON.stringify(r)));
          console.log('\nTRANSITIVE_HIGH_CRITICAL');
          rows.filter(r => !r.direct && ['high', 'critical'].includes(r.severity)).forEach(r => console.log(JSON.stringify(r)));
          NODE

      - name: Show direct production dependency tree
        run: npm ls --depth=0 --omit=dev || true
