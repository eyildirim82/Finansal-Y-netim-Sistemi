name: Persist PostgreSQL baseline

on:
  push:
    branches:
      - fix/14-postgresql-runtime
    paths:
      - '.github/workflows/postgresql-baseline-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finansal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d finansal_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finansal_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/14-postgresql-runtime

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate PostgreSQL schema and baseline
        working-directory: backend
        run: |
          sed -i '0,/provider = "sqlite"/s//provider = "postgresql"/' prisma/schema.prisma
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20260930110000_postgresql_baseline
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            > prisma/migrations/20260930110000_postgresql_baseline/migration.sql
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually
          # It should be added in your version-control system (i.e. Git)
          provider = "postgresql"
          EOF

      - name: Add local PostgreSQL connection example
        run: |
          cat > .env.example <<'EOF'
          # Local development / Docker Compose template
          POSTGRES_DB=finansal_yonetim
          POSTGRES_USER=finansal_user
          POSTGRES_PASSWORD=change_me

          # Used when running Prisma/backend directly on the host.
          # Docker Compose builds its service-to-service DATABASE_URL from POSTGRES_* above.
          DATABASE_URL=postgresql://finansal_user:change_me@localhost:5432/finansal_yonetim?schema=public

          JWT_SECRET=change_me_to_a_long_random_secret
          REDIS_URL=redis://redis:6379
          FRONTEND_URL=http://localhost:3000
          VITE_API_URL=http://localhost:3001/api

          GRAFANA_ADMIN_PASSWORD=change_me
          EOF

      - name: Validate clean PostgreSQL baseline
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test

      - name: Commit generated database files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/prisma .env.example
          git commit -m "db: align Prisma runtime with PostgreSQL"
          git push origin HEAD:fix/14-postgresql-runtime
